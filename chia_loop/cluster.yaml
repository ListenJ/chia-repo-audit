# CHIA cluster for the reproducibility audit.
#
# Default target: the official ChampSim worker image documented by CHIA:
#   https://docs.chialoops.ai/en/latest/case-studies/architectural-discovery-basic.html
#
# Set CHAMPSIM_TRACE_DIR on the host before `chia up`; the directory is mounted
# read-only into every simulation worker.

provider:
    head_ip: ${THIS_MACHINE}

auth:
    ssh_user: ${USER}
    # ssh_private_key: ~/.ssh/<ssh_key_name>

available_node_types:
    champsim_build:
        resources: {"champsim_build": 1}
        num_workers: 1
        compatible_ips: ["${THIS_MACHINE}"]
        docker:
            image: "ghcr.io/ucb-bar/chia-champsim:latest"
            container_name: "chia-champsim-build-${USER}"
            pull_before_run: true
            run_options:
                - --cpuset-cpus=0-7
                - -v ${CHAMPSIM_TRACE_DIR}:/traces:ro
            pull_timeout: 3600

    champsim:
        resources: {"champsim": 1}
        num_workers: 3
        compatible_ips: ["${THIS_MACHINE}"]
        docker:
            image: "ghcr.io/ucb-bar/chia-champsim:latest"
            container_name: "chia-champsim-run-${USER}"
            pull_before_run: true
            run_options:
                - -v ${CHAMPSIM_TRACE_DIR}:/traces:ro
            pull_timeout: 3600
